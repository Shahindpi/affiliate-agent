name: Dewdora frontend and API compatibility

on:
  push:
    branches: [main, "chatgpt/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend-contract:
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: ${{ github.workspace }}/dewdora-backend/database/ci.sqlite
      CACHE_STORE: array
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Shahindpi/dewdora-backend
          path: dewdora-backend
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: dewdora-backend
      - name: Verify Laravel routes, migrations, and tests
        working-directory: dewdora-backend
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/ci.sqlite
          php artisan route:list
          php artisan migrate --force
          php artisan migrate:status
          php artisan test

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dewdora-frontend
      - uses: actions/checkout@v4
        with:
          repository: Shahindpi/dewdora-backend
          path: dewdora-backend
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: dewdora-frontend/package-lock.json
      - run: composer install --no-interaction --prefer-dist
        working-directory: dewdora-backend
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: dewdora-frontend
      - name: Verify production pages against Laravel
        shell: bash
        run: |
          set -euo pipefail
          export DB_CONNECTION=sqlite DB_DATABASE="$PWD/dewdora-backend/database/acceptance.sqlite" CACHE_STORE=array SESSION_DRIVER=array APP_URL=http://127.0.0.1:8000
          touch "$DB_DATABASE"
          mkdir -p dewdora-backend/storage/app/public/uploads/images
          cp dewdora-frontend/public/dewdora-og.png dewdora-backend/storage/app/public/uploads/images/test-product.png
          cd dewdora-backend
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force
          php artisan db:seed --class=RuntimeAcceptanceSeeder --force
          php artisan storage:link
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/dewdora-php.log 2>&1 & php_pid=$!
          cd ../dewdora-frontend
          export NEXT_PUBLIC_GA_ID=G-TEST12345 NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1 API_URL=http://127.0.0.1:8000/api/v1 NEXT_PUBLIC_STORAGE_URL=http://127.0.0.1:8000/storage
          npm run build
          npm run start -- -p 3000 -H 127.0.0.1 > /tmp/dewdora-next.log 2>&1 & next_pid=$!
          trap 'kill "$php_pid" "$next_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_ADMIN_EMAIL=runtime@example.test E2E_ADMIN_PASSWORD='RuntimeTest!2026' npm test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-failure
          path: |
            dewdora-frontend/test-results/
            /tmp/dewdora-php.log
            /tmp/dewdora-next.log
