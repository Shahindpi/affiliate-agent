name: Dewdora and Affiliate Agent verification

on:
  push:
    branches: [main, "chatgpt/**"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: composer install --no-interaction --prefer-dist
        working-directory: agent-backend
      - name: Verify routes, migrations, tests and real FFmpeg render
        working-directory: agent-backend
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          php artisan route:list --path=affiliate-agent
          php artisan test
          touch database/ci.sqlite
          DB_DATABASE="$PWD/database/ci.sqlite" php artisan migrate --force
          DB_DATABASE="$PWD/database/ci.sqlite" php artisan migrate:status

  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, sqlite3, pdo_sqlite, fileinfo, gd
          coverage: none
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: composer install --no-interaction --prefer-dist
        working-directory: agent-backend
      - run: npm ci && npx playwright install --with-deps chromium
      - name: Verify public pages, admin and review UI against Laravel
        shell: bash
        run: |
          set -euo pipefail
          export DB_CONNECTION=sqlite DB_DATABASE="$PWD/agent-backend/database/acceptance.sqlite" QUEUE_CONNECTION=database CACHE_STORE=file SESSION_DRIVER=file APP_URL=http://127.0.0.1:8000
          touch "$DB_DATABASE"
          mkdir -p agent-backend/storage/app/public/uploads/images
          cp public/dewdora-og.png agent-backend/storage/app/public/uploads/images/test-product.png
          cd agent-backend
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --seed --force
          php artisan db:seed --class=RuntimeAcceptanceSeeder --force
          php artisan storage:link
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/dewdora-php.log 2>&1 & php_pid=$!
          php artisan queue:work database --queue=agent-revisions,agent-publishing --sleep=1 --tries=3 --timeout=850 > /tmp/dewdora-agent-worker.log 2>&1 & worker_pid=$!
          cd ..
          export NEXT_PUBLIC_GA_ID=G-TEST12345 NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3000 NEXT_PUBLIC_API_URL=http://127.0.0.1:8000/api/v1 API_URL=http://127.0.0.1:8000/api/v1 NEXT_PUBLIC_STORAGE_URL=http://127.0.0.1:8000/storage
          npm run build
          npm run start -- -p 3000 -H 127.0.0.1 > /tmp/dewdora-next.log 2>&1 & next_pid=$!
          trap 'kill "$php_pid" "$worker_pid" "$next_pid" 2>/dev/null || true' EXIT
          for attempt in {1..45}; do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          E2E_ADMIN_EMAIL=runtime@example.test E2E_ADMIN_PASSWORD='RuntimeTest!2026' npm test
          E2E_ADMIN_EMAIL=runtime@example.test E2E_ADMIN_PASSWORD='RuntimeTest!2026' node scripts/agent-review-acceptance.mjs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-failure
          path: |
            test-results/
            /tmp/dewdora-php.log
            /tmp/dewdora-next.log
            /tmp/dewdora-agent-worker.log
